services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      TEXT_MODEL: ${TEXT_MODEL:-gpt-oss:20b}
      VISION_MODEL: ${VISION_MODEL:-qwen2.5vl:7b}
      NUM_CTX: ${NUM_CTX:-16384}
      TEMPERATURE: ${TEMPERATURE:-0}
      TOP_K: ${TOP_K:-1}
      SEED: ${SEED:-42}
      LLM_CACHE: ${LLM_CACHE:-1}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      THINK: ${THINK:-low}
    volumes:
      - kpi-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  kpi-data:
