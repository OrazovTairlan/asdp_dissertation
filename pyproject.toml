[project]
name = "intelligent-kpi-evaluation"
version = "1.0.0"
description = "Intelligent KPI verification system: NLP (gpt-oss:20b) + computer vision for evidence checking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = [".venv", "frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "SIM108", "B905", "B008", "RUF005", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF012"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
