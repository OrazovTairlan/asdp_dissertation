services:
  app:
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      TEXT_MODEL: ${TEXT_MODEL:-gpt-oss:20b}
      VISION_MODEL: ${VISION_MODEL:-qwen2.5vl:7b}
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull $$TEXT_MODEL && ollama pull $$VISION_MODEL"]
    restart: "no"

volumes:
  ollama-models:
